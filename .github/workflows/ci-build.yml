name: CI Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

# cancel older, redundant builds that haven't started yet
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        working-directory: frontend
        run: npm ci

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: test
        working-directory: frontend
        run: npm test

      # `npm run build` typechecks with `tsc -b` before bundling, so this
      # covers both.
      - name: build
        working-directory: frontend
        run: npm run build

  desktop:
    name: Desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: install
        working-directory: desktop
        run: npm ci

      - name: typecheck
        working-directory: desktop
        run: npm run typecheck

      # `npm test` compiles to dist/ first and runs the suite from there.
      - name: test
        working-directory: desktop
        run: npm test

  gateway:
    name: Build Linux AMD64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: install
        run: go install ./...

      - name: test
        run: go test ./...

      - name: solve GOBIN
        id: solve_go_bin
        shell: bash
        run: |
          echo DEBUG: go_path="$(go env GOPATH)"
          echo go_bin="$(go env GOPATH)/bin" >> $GITHUB_OUTPUT

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            ${{ steps.solve_go_bin.outputs.go_bin }}/llm-gateway
          if-no-files-found: error
